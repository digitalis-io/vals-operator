---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: valssecrets.digitalis.io
spec:
  group: digitalis.io
  names:
    kind: ValsSecret
    listKind: ValsSecretList
    plural: valssecrets
    singular: valssecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.target.kind
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ValsSecret is the Schema for the valssecrets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ValsSecretSpec defines the desired state of ValsSecret
            properties:
              data:
                additionalProperties:
                  description: DataSource defines a secret
                  properties:
                    encoding:
                      description: Encoding type for the secret. Only base64 supported.
                        Optional
                      type: string
                    ref:
                      description: |-
                        Ref value to the secret in the format ref+backend://path
                        https://github.com/helmfile/vals
                      type: string
                  required:
                  - ref
                  type: object
                type: object
              databases:
                items:
                  description: Database defines a DB connection
                  properties:
                    driver:
                      description: Defines the database type
                      type: string
                    hosts:
                      description: List of hosts to connect to, they'll be tried in
                        sequence until one succeeds
                      items:
                        type: string
                      type: array
                    loginCredentials:
                      description: Credentials to access the database
                      properties:
                        namespace:
                          description: Optional namespace of the secret, default current
                            namespace
                          type: string
                        passwordKey:
                          description: Key in the secret containing the database username
                          type: string
                        secretName:
                          description: Name of the secret containing the credentials
                            to be able to log in to the database
                          type: string
                        usernameKey:
                          description: Key in the secret containing the database username
                          type: string
                      required:
                      - passwordKey
                      - secretName
                      type: object
                    passwordKey:
                      description: Key in the secret containing the database password
                      type: string
                    port:
                      description: Database port number
                      type: integer
                    protocol:
                      description: |-
                        Used for ClickHouse only, the wire protocol to use: native (also
                        accepted as tcp or clickhouse) or http. Defaults to native. A scheme
                        on a host entry overrides this.
                      enum:
                      - native
                      - tcp
                      - clickhouse
                      - http
                      type: string
                    tls:
                      description: |-
                        Used for ClickHouse only, the TLS mode: preferred (default, TLS with
                        a plaintext fallback), disable, require or skip-verify. A scheme on a
                        host entry overrides this.
                      enum:
                      - preferred
                      - disable
                      - require
                      - skip-verify
                      type: string
                    userHost:
                      description: Used for MySQL only, the host part for the username
                      type: string
                    usernameKey:
                      description: Key in the secret containing the database username
                      type: string
                  required:
                  - driver
                  - hosts
                  - passwordKey
                  type: object
                type: array
              name:
                type: string
              rollout:
                items:
                  description: RolloutTarget sets up what deployment or sts to restart
                  properties:
                    kind:
                      description: Kind is either Deployment or StatefulSet
                      type: string
                    name:
                      description: Name is the object name
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              target:
                description: |-
                  Target renders the resolved data into an arbitrary namespaced resource
                  (ConfigMap, a CRD, ...) instead of a Secret. Requires the operator to run
                  with -enable-custom-targets and the target resource to be listed in
                  -allowed-target-resources.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations to set on the target (create mode only).
                      Not templated.
                    type: object
                  apiVersion:
                    description: |-
                      APIVersion of the target object, e.g. "v1" or "flink.apache.org/v1beta1".
                      Not templatable.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the target object, e.g. "ConfigMap". Not
                      templatable.
                    minLength: 1
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels to set on the target (create mode only). Not
                      templated.
                    type: object
                  mode:
                    default: create
                    description: Mode is "create" (default) or "patch".
                    enum:
                    - create
                    - patch
                    type: string
                  name:
                    description: |-
                      Name of the target object. Defaults to the ValsSecret name. The target
                      always lives in the ValsSecret namespace.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  template:
                    description: |-
                      Template is a Go template (sprig functions available) rendering to a YAML
                      document with the object body below metadata, e.g.

                        spec:
                          flinkConfiguration:
                            metrics.reporter.dghttp.apikey: {{ .datadog_api_key | quote }}

                      Resolved data keys are available as {{ .<key> }} and {{ .Secrets.<key> }};
                      the ValsSecret name and namespace as {{ .ValsSecret.Name }} /
                      {{ .ValsSecret.Namespace }}. The rendered document must not contain
                      apiVersion, kind, metadata or status.
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - template
                type: object
              template:
                additionalProperties:
                  type: string
                type: object
              ttl:
                format: int64
                type: integer
              type:
                type: string
            required:
            - data
            type: object
            x-kubernetes-validations:
            - message: spec.template cannot be used with spec.target; put the template
                in spec.target.template
              rule: '!has(self.target) || !has(self.template)'
            - message: spec.databases cannot be used with spec.target
              rule: '!has(self.target) || !has(self.databases) || size(self.databases)
                == 0'
            - message: spec.rollout cannot be used with spec.target
              rule: '!has(self.target) || !has(self.rollout) || size(self.rollout)
                == 0'
          status:
            description: ValsSecretStatus defines the observed state of ValsSecret
            properties:
              conditions:
                description: Conditions of the ValsSecret. Currently only populated
                  when spec.target is set.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              target:
                description: Target records the last custom target apply.
                properties:
                  apiVersion:
                    type: string
                  hash:
                    description: Hash is the sha256 of the rendered body; used to
                      skip no-op applies.
                    type: string
                  kind:
                    type: string
                  lastApplied:
                    format: date-time
                    type: string
                  mode:
                    description: TargetMode selects how the target object is written.
                    enum:
                    - create
                    - patch
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - apiVersion
                - kind
                - mode
                - name
                - namespace
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
