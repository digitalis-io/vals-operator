# Sync values from a secrets backend into a Kubernetes Secret named `my-secret`.
# Replace the `ref+vault://` references with any backend vals supports.
apiVersion: digitalis.io/v1
kind: ValsSecret
metadata:
  name: valssecret-sample
spec:
  # Name of the Kubernetes Secret to create. Defaults to the resource name.
  name: my-secret
  # Seconds between backend reads. Defaults to the operator's -ttl flag (5m).
  ttl: 3600
  # Kubernetes Secret type. Defaults to Opaque.
  type: Opaque
  data:
    username:
      ref: ref+vault://secret/mycreds/username
      encoding: text
    password:
      ref: ref+vault://secret/mycreds/password
      encoding: text
  # Optional: render extra keys from Go templates. Every key in `data` is available
  # as a variable. The sprig functions env, expandenv and getHostByName are not.
  template:
    connection.conf: |
      user={{ .username }}
      password={{ .password }}
  # Optional: restart these workloads when the secret changes.
  # Only Deployment and StatefulSet are supported.
  rollout:
    - kind: Deployment
      name: myapp
