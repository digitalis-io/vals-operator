# Requires the operator to run with:
#   -enable-custom-targets -allowed-target-resources=configmaps
apiVersion: digitalis.io/v1
kind: ValsSecret
metadata:
  name: valssecret-target-sample
spec:
  ttl: 3600
  data:
    db_host:
      ref: ref+awsssm://myapp/prod/db_host
    region:
      ref: eu-west-1 # literal, not looked up
  target:
    apiVersion: v1
    kind: ConfigMap
    name: app-config
    mode: create
    labels:
      app: myapp
    template: |
      data:
        region: {{ .region }}
        application.yaml: |
          db:
            host: {{ .db_host }}
