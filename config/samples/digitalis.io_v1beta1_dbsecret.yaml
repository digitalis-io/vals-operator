# Dynamic database credentials issued by the Vault/OpenBao database secrets engine.
# Requires Vault >= 1.10 or OpenBao >= 2.0, with a database secrets engine mounted at
# `cass000` and a role named `readonly`.
apiVersion: digitalis.io/v1beta1
kind: DbSecret
metadata:
  labels:
    app.kubernetes.io/name: dbsecret
    app.kubernetes.io/instance: dbsecret-sample
    app.kubernetes.io/part-of: vals-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: vals-operator
  name: dbsecret-sample
spec:
  # Name of the Kubernetes Secret to create. Defaults to the resource name.
  secretName: cassandra-credentials
  # Renew the lease rather than issuing new credentials on every cycle.
  renew: true
  vault:
    # Mount of the database secrets engine.
    mount: cass000
    # Role to request credentials for.
    role: readonly
  # Optional: rename the `username` and `password` keys the backend returns.
  template:
    CASSANDRA_USERNAME: "{{ .username }}"
    CASSANDRA_PASSWORD: "{{ .password }}"
  # Optional: restart these workloads when the credentials change.
  # Only Deployment and StatefulSet are supported.
  rollout:
    - kind: Deployment
      name: cassandra-client
