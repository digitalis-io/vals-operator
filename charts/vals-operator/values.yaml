# -- Declared for compatibility. The Deployment template always renders a single
# replica; enable `-leader-elect` via `args` if you change this in a fork.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/digitalis-io/vals-operator
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Pull secrets for a private registry, e.g. `[{name: my-registry}]`.
imagePullSecrets: []
# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix.
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account. Use this for IRSA on EKS,
  # e.g. `{eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vals}`.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Render the ValsSecret and DbSecret CRDs as part of the chart. Set to false
# when the CRDs are managed elsewhere, such as by a cluster-scoped GitOps process.
manageCrds: true

# -- Install the DbSecret CRD and the wider RBAC that controller requires.
# This may not be required by everyone and the pod will require wider permissions
# which may not be desired on secure environments
enableDbSecrets: true

prometheusRules:
  # -- Create a PrometheusRule with the operator's alerts.
  enabled: false
  # -- Additional labels for PrometheusRule alerts,
  # e.g. `{severity_team: platform}`.
  additionalRuleLabels: {}

  # -- Additional annotations for PrometheusRule alerts,
  # e.g. `{runbook_url: https://example.com/runbook}`.
  additionalRuleAnnotations: {}

# -- Additional command-line flags for the operator,
# e.g. `["-exclude-namespaces=kube-system", "-ttl=15m"]`.
# See https://github.com/digitalis-io/vals-operator/blob/main/docs/configuration.md
args: []
  # -exclude-namespaces string
  #   	Comma separated list of namespaces to ignore.
  # -health-probe-bind-address string
  #   	The address the probe endpoint binds to. (default ":8081")
  # -kubeconfig string
  #   	Paths to a kubeconfig. Only required if out-of-cluster.
  # -leader-elect
  #   	Enable leader election for controller manager. Enabling this will ensure there is only one active controller manager.
  # -metrics-bind-address string
  #   	The address the metric endpoint binds to. (default ":8080")
  # -reconcile-period duration
  #   	How often the controller will re-queue vals-operator events. (default 5s)
  # -record-changes
  #   	Records every time a secret has been updated. You can view them with kubectl describe. It may also be disabled globally and enabled per secret via the annotation 'vals-operator.digitalis.io/record: "true"' (default true)
  # -ttl duration
  #   	How often to check backend for updates. (default 5m0s)
  # -disable-namespace-sync
  #   	Disable cross-namespace ref+k8s:// references. When true, a ValsSecret can only reference k8s secrets in its own namespace.
  # -allowed-namespaces-for-sync string
  #   	Comma-separated list of namespaces that may be referenced via ref+k8s://. Empty means all namespaces are allowed (unless -disable-namespace-sync is true).
  # -allowed-backend-paths string
  #   	Restrict which backend paths each namespace may read, covering both ValsSecret references and DbSecret mounts/roles. Semicolon-separated 'namespace=prefix[,prefix...]' entries, where a namespace of '*' applies to all. Empty means all paths are allowed.
  # -watch-namespaces string
  #   	Comma separated list of namespaces that vals-operator will watch.
  # -zap-devel
  #   	Development Mode defaults(encoder=consoleEncoder,logLevel=Debug,stackTraceLevel=Warn). Production Mode defaults(encoder=jsonEncoder,logLevel=Info,stackTraceLevel=Error) (default true)
  # -zap-encoder value
  #   	Zap log encoding (one of 'json' or 'console')
  # -zap-log-level value
  #   	Zap Level to configure the verbosity of logging. Can be one of 'debug', 'info', 'error', or any integer value > 0 which corresponds to custom debug levels of increasing verbosity
  # -zap-stacktrace-level value
  #   	Zap Level at and above which stacktraces are captured (one of 'info', 'error', 'panic').


# -- Renders `-disable-namespace-sync`.
# Disable cross-namespace ref+k8s:// references. When true, a ValsSecret can only
# reference k8s secrets in its own namespace. Takes precedence over allowedNamespacesForSync.
disableNamespaceSync: false

# -- Renders `-allowed-namespaces-for-sync`, e.g. `"shared-secrets,platform"`.
# Comma-separated list of namespaces that may be referenced via ref+k8s://.
# Empty string means all namespaces are allowed (unless disableNamespaceSync is true).
allowedNamespacesForSync: ""

# -- Renders `-allowed-backend-paths`,
# e.g. `"team-a=ref+vault://database/creds/team-a;*=ref+awssecrets://shared"`.
# Restrict which backend paths each namespace may read. This covers BOTH the
# references in a ValsSecret (every backend, not just ref+k8s://) and the mount
# and role named by a DbSecret, so that restricting one resource cannot be
# sidestepped through the other.
#
# Semicolon-separated "namespace=prefix[,prefix...]" entries. A namespace of "*"
# applies to every namespace, in addition to any namespace-specific entry.
# Prefixes match on path-segment boundaries.
#
# Empty string (the default) allows every path the operator's backend credential
# can read. Set this on any cluster where namespaces are not all equally trusted:
# the operator holds one credential for all namespaces, so anybody who can create
# a ValsSecret or DbSecret otherwise inherits its full reach.
allowedBackendPaths: ""

# -- Name of a single Secret loaded into the pod with `envFrom`,
# e.g. `vals-operator-env`. Takes precedence over `secretEnv` when set.
environmentSecret: ""

# Secrets backend configuration
# Choose either Vault or OpenBao by setting the appropriate enabled flag

# OpenBao configuration (recommended for new deployments)
openbao:
  # -- Render the `BAO_*` environment variables.
  enabled: false
  # -- OpenBao server URL (`BAO_ADDR`).
  address: "http://openbao:8200"
  # -- Skip TLS certificate verification (`BAO_SKIP_VERIFY`).
  skipVerify: false
  # Authentication configuration
  auth:
    # Kubernetes auth
    kubernetes:
      # -- Kubernetes auth role (`BAO_ROLE_ID`), e.g. `vals-operator`.
      roleId: ""
      # -- Kubernetes auth mount (`BAO_KUBERNETES_MOUNT_POINT`).
      mountPoint: "kubernetes"
    # AppRole auth
    approle:
      # -- AppRole role ID (`BAO_APP_ROLE`).
      roleId: ""
      # -- AppRole secret ID (`BAO_SECRET_ID`). Prefer `environmentSecret` — this
      # value ends up in the Helm release manifest.
      secretId: ""
      # -- AppRole mount (`BAO_APPROLE_MOUNT_PATH`).
      mountPath: "approle"
    # UserPass auth
    userpass:
      # -- Userpass username (`BAO_LOGIN_USER`). Not recommended.
      username: ""
      # -- Userpass password (`BAO_LOGIN_PASSWORD`). Not recommended.
      password: ""
      # -- Userpass mount (`BAO_USERPASS_MOUNT_PATH`).
      mountPath: "userpass"

# HashiCorp Vault configuration (legacy, for backwards compatibility)
vault:
  # -- Render the `VAULT_*` environment variables.
  enabled: false
  # -- Vault server URL (`VAULT_ADDR`).
  address: "http://vault:8200"
  # -- Skip TLS certificate verification (`VAULT_SKIP_VERIFY`).
  skipVerify: false
  # Authentication configuration
  auth:
    # Kubernetes auth
    kubernetes:
      # -- Kubernetes auth role (`VAULT_ROLE_ID`), e.g. `vals-operator`.
      roleId: ""
      # -- Kubernetes auth mount (`VAULT_KUBERNETES_MOUNT_POINT`).
      mountPoint: "kubernetes"
    # AppRole auth
    approle:
      # -- AppRole role ID (`VAULT_APP_ROLE`).
      roleId: ""
      # -- AppRole secret ID (`VAULT_SECRET_ID`). Prefer `environmentSecret`.
      secretId: ""
      # -- AppRole mount (`VAULT_APPROLE_MOUNT_PATH`).
      mountPath: "approle"
    # UserPass auth
    userpass:
      # -- Userpass username (`VAULT_LOGIN_USER`). Not recommended.
      username: ""
      # -- Userpass password (`VAULT_LOGIN_PASSWORD`). Not recommended.
      password: ""
      # -- Userpass mount (`VAULT_USERPASS_MOUNT_PATH`).
      mountPath: "userpass"

# -- Additional environment variables for vals backends,
# e.g. `[{name: AWS_DEFAULT_REGION, value: "us-west-2"}]`.
# See https://github.com/helmfile/vals
# for information on setting up your backend environment.
env: []
  # - name: AWS_DEFAULT_REGION
  #   value: "us-west-2"

# -- `envFrom` sources for the operator container,
# e.g. `[{secretRef: {name: aws-creds}}]`. Ignored when `environmentSecret` is set.
secretEnv: []
  # - secretRef:
  #     name: aws-creds

# -- Additional pod volumes,
# e.g. `[{name: creds, secret: {secretName: gcs-credentials}}]`.
volumes: []
  # - name: creds
  #   secret:
  #     secretName: gcs-credentials
# -- Additional container volume mounts,
# e.g. `[{name: creds, mountPath: /secret, readOnly: true}]`.
volumeMounts: []
  # - name: creds
  #   mountPath: /secret
  #   readOnly: true


# -- Pod-level security context, e.g. `{fsGroup: 2000}`.
podSecurityContext: {}
  # fsGroup: 2000

# -- Container-level security context,
# e.g. `{runAsNonRoot: true, readOnlyRootFilesystem: true}`.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

podMonitor:
  # -- Create a Prometheus Operator PodMonitor for the operator pod, scraping
  # /metrics every 30s in the release namespace.
  enabled: false
  # -- Reserved. Not currently applied by the PodMonitor template, which carries
  # the standard chart labels only.
  labels: {}

# -- Container resource requests and limits,
# e.g. `{requests: {cpu: 100m, memory: 128Mi}}`.
resources: {}

# -- Node selector for the operator pod.
nodeSelector: {}

# -- Tolerations for the operator pod.
tolerations: []

# -- Affinity rules for the operator pod.
affinity: {}
