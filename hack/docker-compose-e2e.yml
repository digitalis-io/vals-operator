# End-to-end test stack: an OpenBao dev server (with the ClickHouse database
# plugin built in and registered) plus one backend per compose profile:
#
#   clickhouse   ClickHouse + "configure" one-shot
#   cassandra    Cassandra with PasswordAuthenticator + "configure-cassandra"
#
# The openbao service has no profile and is always started. clickhouse and
# configure are gated behind the clickhouse profile, so a plain
# "docker compose up" starts only openbao; name the services or pass
# --profile clickhouse (also needed for down/logs).
#
# Overridable environment: OPENBAO_PORT (8200), BAO_ROOT_TOKEN (root),
# CLICKHOUSE_NATIVE_PORT (9000), CASSANDRA_NATIVE_PORT (9042),
# CASSANDRA_VERSION (4.1, flat "authenticator:" yaml form required).
#
# When to use this vs hack/clickhouse-test-server.sh:
#   - Use this stack for tests that involve a secrets backend (OpenBao KV
#     rotation path, OpenBao ClickHouse database plugin / DbSecret path).
#   - Use clickhouse-test-server.sh for TLS endpoint coverage (native TLS on
#     9440 and HTTPS on 8443), which this stack does not provide.
#
# Start locally:
#   docker compose -f hack/docker-compose-e2e.yml up -d --build --wait clickhouse openbao
#   docker compose -f hack/docker-compose-e2e.yml run --rm configure
#
# Run the integration tests:
#   OPENBAO_ADDR=http://127.0.0.1:8200 OPENBAO_TOKEN=root \
#   BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root \
#   CLICKHOUSE_NATIVE_ADDR=127.0.0.1:9000 CLICKHOUSE_LOGIN_PASSWORD=clickhouse \
#   go test -tags integration -race ./db/clickhouse/... ./vault/...
#
# Credentials:
#   ClickHouse:  default / ${CLICKHOUSE_PASSWORD:-clickhouse}  native :9000  HTTP :8123
#   OpenBao:     root token "root"  :8200
#   KV path:     secret/vals-clickhouse  (password for rotation test)
#   DB mount:    clickhouse/  (ClickHouse database plugin)
#   DB role:     readonly
#
# ClickHouse scenario: see "Start locally" above. Profile-gated services are
# started when named explicitly; use --profile clickhouse with down/logs.
#
# Cassandra scenario:
#   docker compose -f hack/docker-compose-e2e.yml --profile cassandra up -d --build --wait cassandra openbao
#   docker compose -f hack/docker-compose-e2e.yml --profile cassandra run --rm configure-cassandra
#   make test-cassandra-e2e   (does all of the above, runs the tests and tears down)
#
#   Cassandra:   cassandra / cassandra  native :9042
#   DB mount:    cassandra/  (built-in cassandra-database-plugin)
#   DB roles:    readonly (TTL 1h, max 24h), shortlived (TTL 15s, max 30s)
#
# Reset (removes all data and built images):
#   docker compose -f hack/docker-compose-e2e.yml --profile clickhouse --profile cassandra down -v --rmi local

services:
  clickhouse:
    profiles: ["clickhouse"]
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: vals-e2e-clickhouse
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # OpenBao dev server with the ClickHouse database plugin registered.
  # Built from the plugin repo; pinned to a specific commit for reproducibility.
  openbao:
    build:
      context: "https://github.com/digitalis-io/openbao-plugin-database-clickhouse.git#304d722b23d6a71da917eb4bfaa7ee5b3154527c"
      target: default
      args:
        OPENBAO_VERSION: ${OPENBAO_VERSION:-2.4.4}
    image: vals-openbao-clickhouse:e2e
    container_name: vals-e2e-openbao
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_TOKEN: ${BAO_ROOT_TOKEN:-root}
    command:
      - server
      - -dev
      - -dev-no-store-token
      - -dev-root-token-id=${BAO_ROOT_TOKEN:-root}
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: enables the database secrets engine, registers the ClickHouse
  # plugin, creates a "readonly" role, and stores a KV secret for the rotation
  # test. Exits 0 when issuance from the plugin works.
  configure:
    profiles: ["clickhouse"]
    image: vals-openbao-clickhouse:e2e
    container_name: vals-e2e-configure
    depends_on:
      openbao:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_ROOT_TOKEN:-root}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    restart: "no"
    entrypoint:
      - sh
      - -ec
      - |
        # Database secrets engine at "clickhouse/" so that GetDbCredentials
        # (which reads <mount>/config/<mount>) finds the connection details.
        bao secrets enable -path=clickhouse database 2>/dev/null || true
        bao secrets enable -path=secret kv-v2 2>/dev/null || true

        bao write clickhouse/config/clickhouse \
          plugin_name=clickhouse-database-plugin \
          allowed_roles="*" \
          connection_url="clickhouse://{{username}}:{{password}}@clickhouse:9000/default" \
          username=default \
          password="$${CLICKHOUSE_PASSWORD}"

        bao write clickhouse/roles/readonly \
          db_name=clickhouse \
          creation_statements="CREATE USER '{{name}}' IDENTIFIED WITH sha256_password BY '{{password}}'; GRANT SELECT ON default.* TO '{{name}}';" \
          revocation_statements="DROP USER IF EXISTS '{{name}}';" \
          default_ttl=1h \
          max_ttl=24h

        # KV secret for the ValsSecret rotation-path test.
        bao kv put secret/vals-clickhouse password=rotated_password_123

        echo "Issuing a test credential to verify setup:"
        bao read clickhouse/creds/readonly

  # Cassandra with authentication and authorization switched on, as the
  # database plugin and the operator both log in with a role and password.
  # The stock image has no environment switch for this, so cassandra.yaml is
  # patched before the normal entrypoint runs. This relies on the flat
  # "authenticator: <class>" form used up to Cassandra 4.1.
  cassandra:
    profiles: ["cassandra"]
    image: cassandra:${CASSANDRA_VERSION:-4.1}
    container_name: vals-e2e-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: vals-e2e
    command:
      - sh
      - -ec
      - |
        sed -i \
          -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \
          -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' \
          /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    ports:
      - "127.0.0.1:${CASSANDRA_NATIVE_PORT:-9042}:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "SELECT release_version FROM system.local"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # One-shot: enables the database secrets engine with the built-in Cassandra
  # plugin and creates a long-lived "readonly" role and a "shortlived" role for
  # rotation and expiry tests. Exits 0 when issuance from the plugin works.
  configure-cassandra:
    profiles: ["cassandra"]
    image: vals-openbao-clickhouse:e2e
    container_name: vals-e2e-configure-cassandra
    depends_on:
      openbao:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_ROOT_TOKEN:-root}
    restart: "no"
    entrypoint:
      - sh
      - -ec
      - |
        bao secrets enable -path=cassandra database 2>/dev/null || true

        bao write cassandra/config/cassandra \
          plugin_name=cassandra-database-plugin \
          allowed_roles="*" \
          hosts=cassandra \
          port=9042 \
          protocol_version=4 \
          username=cassandra \
          password=cassandra

        bao write cassandra/roles/readonly \
          db_name=cassandra \
          creation_statements="CREATE ROLE '{{username}}' WITH PASSWORD = '{{password}}' AND LOGIN = true; GRANT SELECT ON ALL KEYSPACES TO '{{username}}';" \
          revocation_statements="DROP ROLE IF EXISTS '{{username}}';" \
          default_ttl=1h \
          max_ttl=24h

        bao write cassandra/roles/shortlived \
          db_name=cassandra \
          creation_statements="CREATE ROLE '{{username}}' WITH PASSWORD = '{{password}}' AND LOGIN = true; GRANT SELECT ON ALL KEYSPACES TO '{{username}}';" \
          revocation_statements="DROP ROLE IF EXISTS '{{username}}';" \
          default_ttl=15s \
          max_ttl=30s

        echo "Issuing a test credential to verify setup:"
        bao read cassandra/creds/readonly
