apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: testapps.test.digitalis.io
spec:
  group: test.digitalis.io
  names:
    kind: TestApp
    listKind: TestAppList
    plural: testapps
    singular: testapp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                config:
                  type: object
                  additionalProperties:
                    type: string
                containers:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: ["name"]
                  items:
                    type: object
                    required: ["name"]
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      env:
                        type: array
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: ["name"]
                        items:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                            value:
                              type: string
